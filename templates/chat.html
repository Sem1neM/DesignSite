<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с ИИ-агентом</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 700px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 16px 20px;
            background: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 12px;
            background: #e74c3c;
        }
        .status.connected { background: #27ae60; }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 75%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.client {
            background: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.agent {
            background: #e9ecef;
            color: #1a1a1a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.system {
            background: #fff3cd;
            color: #856404;
            align-self: center;
            font-style: italic;
            max-width: 90%;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            display: block;
        }
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: white;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
            transition: border 0.2s;
        }
        .input-area input:focus { border-color: #0084ff; }
        .input-area input:disabled { background: #f5f5f5; }
        .input-area button {
            padding: 10px 24px;
            background: #0084ff;
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .input-area button:hover:not(:disabled) { background: #0066cc; }
        .input-area button:disabled { background: #b0b0b0; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="chat-app">
        <div class="header">
            <h1>💬 Чат с ИИ-агентом</h1>
            <span class="status" id="status">⏳ Подключение...</span>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Введите сообщение..." disabled>
            <button id="sendBtn" disabled>Отправить</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get('task_id');
        const token = urlParams.get('token') || localStorage.getItem('access_token');

        if (!taskId || !token) {
            document.getElementById('messages').innerHTML = 
                '<div class="message system">⚠️ Не передан task_id или токен авторизации</div>';
            throw new Error('Missing task_id or token');
        }

        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/api/v1/ws/${taskId}?token=${token}`;
        let socket = null;

        function updateStatus(connected) {
            statusEl.textContent = connected ? '✅ Подключено' : '❌ Отключено';
            statusEl.className = connected ? 'status connected' : 'status';
            messageInput.disabled = !connected;
            sendBtn.disabled = !connected;
        }

        function addMessage(sender, content, created_at) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = content;
            if (created_at) {
                const time = document.createElement('span');
                time.className = 'time';
                time.textContent = new Date(created_at).toLocaleTimeString();
                div.appendChild(time);
            }
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function connectWebSocket() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log('WebSocket connected');
                updateStatus(true);
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'history' || data.type === 'message') {
                        addMessage(data.sender, data.content, data.created_at);
                    } else if (data.type === 'error') {
                        addMessage('system', '⚠️ ' + data.content);
                    }
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            socket.onclose = () => {
                console.log('WebSocket closed');
                updateStatus(false);
                setTimeout(connectWebSocket, 3000);
            };

            socket.onerror = () => {
                console.error('WebSocket error');
                updateStatus(false);
            };
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !socket || socket.readyState !== WebSocket.OPEN) return;
            socket.send(JSON.stringify({ content }));
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        connectWebSocket();

        if (token && !localStorage.getItem('access_token')) {
            localStorage.setItem('access_token', token);
        }
    </script>
</body>
</html></title>
